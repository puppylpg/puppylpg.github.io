<text x="485.000" y="305.000" font-size="17" fill="#f4c57b" text-anchor="start">目标累计数：990</text>
<path d="M 663 269 L 719.741 197.000" fill="none" stroke="#f4c57b" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="492.000" y="484.000" font-size="17" fill="#e6edf3" text-anchor="middle">耗时 / ms</text>
<text transform="translate(35 275) rotate(-90)" font-size="17" fill="#e6edf3" text-anchor="middle">累计请求数 / 次</text>
<text x="112.000" y="526.000" font-size="15" fill="#a6b2c5" text-anchor="start">线段表示桶内均匀分布假设下的估计关系，不代表真实请求样本。</text>
