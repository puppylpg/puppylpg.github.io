<text x="98.000" y="345.000" font-size="15" fill="#a6b2c5" text-anchor="end">960</text>
<line x1="112.000" y1="290.000" x2="872.000" y2="290.000" stroke="#2b3546" stroke-width="0.8"/>
<line x1="107.000" y1="290.000" x2="112.000" y2="290.000" stroke="#a6b2c5" stroke-width="1"/>
<text x="98.000" y="295.000" font-size="15" fill="#a6b2c5" text-anchor="end">970</text>
<line x1="112.000" y1="240.000" x2="872.000" y2="240.000" stroke="#2b3546" stroke-width="0.8"/>
<line x1="107.000" y1="240.000" x2="112.000" y2="240.000" stroke="#a6b2c5" stroke-width="1"/>
