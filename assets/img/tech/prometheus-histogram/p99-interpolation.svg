<line x1="107.000" y1="190.000" x2="112.000" y2="190.000" stroke="#a6b2c5" stroke-width="1"/>
<text x="98.000" y="195.000" font-size="15" fill="#f4c57b" text-anchor="end">990</text>
<line x1="112.000" y1="165.000" x2="872.000" y2="165.000" stroke="#2b3546" stroke-width="0.8"/>
<line x1="107.000" y1="165.000" x2="112.000" y2="165.000" stroke="#a6b2c5" stroke-width="1"/>
